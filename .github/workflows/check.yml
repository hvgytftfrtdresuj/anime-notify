name: Check new episodes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "Отправить тестовое сообщение (1 = да, 0 = нет)"
        default: "0"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run notifier
        run: python jutsu_notifier.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PING: ${{ github.event.inputs.ping }}

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add jutsu_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
